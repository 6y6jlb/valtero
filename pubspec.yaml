name: valtero
description: "Multi-currency expense tracker"
publish_to: 'none'
# Synced from ./VERSION by scripts/app_version.sh (make sync-version / build / release).
# Edit VERSION, not this line. Format: <semver>+<build> e.g. 1.1.0+2
version: 1.4.8+1

environment:
  sdk: ^3.11.4
  flutter: '>=3.41.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.0.0
  dio: ^5.9.0
  hive_ce: ^2.15.1
  hive_ce_flutter: ^2.3.3
  drift: ^2.32.0
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: any
  fl_chart: ^1.0.0
  csv: ^8.0.0
  share_plus: ^13.0.0
  file_selector: ^1.0.3
  country_flags: ^4.1.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  sealed_currencies: ^3.3.0
  cryptography: ^2.9.0
  flutter_web_auth_2: ^5.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
